<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#17372e" />
    <meta name="description" content="Neutrálny prehľad zaregistrovaných kandidátov na starostu obce Bernolákovo v komunálnych voľbách 2026." />
    <title>Kandidáti na starostu obce Bernolákovo — BernoInfo 2026</title>
    <noscript>
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #eeeae1; color: #17372e; font-family: Arial, sans-serif; line-height: 1.5; }
        .static-page { max-width: 1100px; min-height: 100vh; margin: auto; background: #f7f5ee; }
        .static-header { padding: 22px clamp(20px, 5vw, 60px); border-bottom: 1px solid #c4ccc0; font-weight: 800; letter-spacing: -.04em; }
        .static-header span { color: #496b58; }
        .static-main { padding: clamp(28px, 5vw, 60px) clamp(20px, 5vw, 60px) 55px; }
        .static-eyebrow { margin: 0 0 10px; color: #496b58; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .static-main h1 { max-width: 760px; margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.08; letter-spacing: -.055em; }
        .static-summary { max-width: 720px; margin: 0 0 30px; }
        .static-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 0 35px; }
        .static-list li { display: flex; gap: 20px; align-items: baseline; padding: 17px; border: 1px solid #d6dbd0; background: #eeeae1; font-size: 1.08rem; font-weight: 700; }
        .static-list span { flex: none; color: #496b58; font-size: 1.5rem; }
        .static-sources { padding-top: 20px; border-top: 1px solid #bfc8bd; font-size: .9rem; }
        .static-sources h2 { margin: 0 0 8px; font-size: 1.1rem; }
        .static-sources p { max-width: 760px; margin: 0 0 10px; }
        .static-sources a { color: #17372e; text-underline-offset: 3px; }
        .static-sources a:focus-visible { outline: 3px solid #b57723; outline-offset: 3px; }
        @media (max-width: 600px) { .static-list { grid-template-columns: 1fr; } .static-list li { padding: 12px 15px; } }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="static-page">
        <header class="static-header">BERNO<span>INFO</span> 2026</header>
        <main class="static-main">
          <p class="static-eyebrow">Bernolákovo / komunálne voľby 2026</p>
          <h1>Kandidáti na starostu obce</h1>
          <p class="static-summary">Osem zaregistrovaných kandidátov v poradí opraveného oficiálneho zoznamu obce. Voľby sa konajú 24. októbra 2026.</p>
          <!-- Keep this static fallback in sync with src/candidates.ts. Numbers are list positions, not independently verified ballot-paper numbers. -->
          <ol class="static-list">
            <li><span aria-label="Číslo v zozname 1">01</span>Michal BARTÓK</li>
            <li><span aria-label="Číslo v zozname 2">02</span>Martin CIRBUS</li>
            <li><span aria-label="Číslo v zozname 3">03</span>Filip KANDRÁČ</li>
            <li><span aria-label="Číslo v zozname 4">04</span>Jaroslav KOŠTIAL</li>
            <li><span aria-label="Číslo v zozname 5">05</span>Peter LAKOTA</li>
            <li><span aria-label="Číslo v zozname 6">06</span>Milan RAJTER</li>
            <li><span aria-label="Číslo v zozname 7">07</span>Roman ŠUTKA</li>
            <li><span aria-label="Číslo v zozname 8">08</span>Miroslav TURENIČ</li>
          </ol>
          <section class="static-sources" aria-labelledby="static-sources-title">
            <h2 id="static-sources-title">Zdroj a stav údajov</h2>
            <p>Mená a poradie: <a href="https://www.bernolakovo.sk/data/advertisement/bernolakovo.sk/532238/204396_zoznam-zaregistrovanych-kandidatov-pre-volby-starostu-obce.pdf">opravený zoznam zaregistrovaných kandidátov (PDF)</a> a <a href="https://www.bernolakovo.sk/novinka/139303/n">oznámenie obce Bernolákovo</a>. Overené 17. októbra 2026. Uvedené čísla sú číslami v zozname, nie označením čísiel na hlasovacom lístku.</p>
            <p>Portréty zatiaľ nie sú zverejnené.</p>
          </section>
        </main>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
