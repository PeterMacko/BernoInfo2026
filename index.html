            <h2 id="static-sources-title">Zdroj a stav údajov</h2>
          <p>Prvotné zhromaždenie podkladov pre profily sa uzavrelo 18. októbra 2026; 19. októbra nasledovala cielená kontrola známych zdrojov, nie úplné opakovanie rešerše. Prehľad facebookových zdrojov za 16. júl – 16. október je čiastočný; neboli preskúmané všetky príspevky, videá ani odpovede v rozhovoroch. Kandidátske tvrdenia sú pripísané kandidátom, nie nezávisle potvrdené. Nedoložený údaj v preskúmaných zdrojoch neznamená, že neexistuje alebo že kandidát odmietol odpovedať.</p>
            <p>BernoInfo 2026 je nezávislý informačný projekt. Nie je oficiálnou stránkou obce Bernolákovo ani s obcou nie je spojený. Erb obce pochádza z <a href="https://www.bernolakovo.sk/">oficiálnej stránky obce</a>.</p>
            <p><strong>Kandidáti na starostu obce:</strong> Mená a poradie podľa <a href="https://www.bernolakovo.sk/data/advertisement/bernolakovo.sk/532238/204396_zoznam-zaregistrovanych-kandidatov-pre-volby-starostu-obce.pdf">opraveného zoznamu (PDF)</a> a <a href="https://www.bernolakovo.sk/novinka/139303/n">oznámenia obce</a>. Naposledy overené 18. októbra 2026.</p>
